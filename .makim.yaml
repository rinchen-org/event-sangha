version: "1.0"
groups:
  dev:
    targets:
      runserver:
        help: Run the server application
        run: |
          sugar compose down
          sugar compose build
          sugar compose-ext restart

      email-tests:
        help: Run isolated test-email endpoint tests with fake sendmail (no real delivery)
        run: python tests/auth/test_email_sender.py

      auth-tests:
        help: Run isolated login and route-protection HTTP tests
        run: python tests/auth/test_auth.py

      setup-tests:
        help: Run isolated authenticated event setup tests (requires PHP sqlite3)
        run: python tests/auth/test_event_setup.py

      qr-tests:
        help: Run isolated staff QR admission tests (requires PHP sqlite3)
        run: python tests/auth/test_qr_admission.py

      qr-migrate:
        help: Add QR decision audit table only (back up the database first)
        run: php src/migrations/0006_qr_admission.php

      serve-local:
        help: Run PHP locally with required private-file and QR protections
        run: php -S 127.0.0.1:8000 -t src scripts/dev-router.php

      tests:
        help: Run the server application
        run: |
          ./vendor/bin/phpunit tests/SettingsTest.php
          ./vendor/bin/phpunit tests/PersonTest.php
          ./vendor/bin/phpunit tests/SubscriptionTest.php
          ./vendor/bin/phpunit tests/EventTest.php
          ./vendor/bin/phpunit tests/EventSessionTest.php
          ./vendor/bin/phpunit tests/AttendanceTest.php
          # ./vendor/bin/phpunit tests/EmailTest.php

  frontend:
    targets:
      install:
        help: Install locked React dependencies
        run: npm ci --prefix frontend
      dev:
        help: Start React development server (PHP_ORIGIN selects the PHP backend)
        run: npm run dev --prefix frontend
      build:
        help: Type-check and build React assets for PHP hosting
        run: npm run build --prefix frontend
      check:
        help: Type-check the React frontend
        run: npm run check --prefix frontend
      tests:
        help: Run isolated frontend tests
        run: npm test --prefix frontend
