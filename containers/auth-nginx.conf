# Include before the image's generic PHP/static locations. These server-level
# rewrites also work when the application is mounted under /event-retiro.
if ($uri ~ "(^|/)\.") { return 404; }
if ($uri ~* "(^|/)(lib|migrations)/") { return 404; }
if ($uri ~* "\.(sqlite3?([-.].*)?|db([-.].*)?|sql|bak|ini|log|html?)$") { return 404; }

# Rewrite to the PHP controller; no direct serving of participant QR images.
rewrite "^(.*)/static/qr/([a-f0-9]{64}\.jpg)$" $1/media.php?file=$2? last;
if ($uri ~ "/static/qr(/|$)") { return 404; }
